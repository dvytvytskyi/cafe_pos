version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: corgi_postgres
    restart: always
    environment:
      POSTGRES_USER: corgi_admin
      POSTGRES_PASSWORD: corgi_password
      POSTGRES_DB: corgi_pos
    ports:
      - '5436:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: corgi_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
